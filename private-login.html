<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StowawayTech Private Login</title><style>body{margin:0;background:#120e1c;color:#fff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}.panel{width:min(380px,90vw);padding:30px;border:1px solid #79569e;border-radius:16px;background:#241931}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font:inherit}input{background:#140e20;color:white;border:1px solid #9371b3}button{margin-top:15px;border:0;background:#8254b2;color:white;cursor:pointer}p{color:#d7c8e6}#error{color:#ffb7b7}</style></head><body><main class="panel"><h1>StowawayTech</h1><p>Private technician access</p><form id="login"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button>Sign in</button></form><p id="error" role="alert"></p></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;document.getElementById('error').textContent='';try{const r=await fetch('/private/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok){location.href='/';return}const d=await r.json();document.getElementById('error').textContent=d.error||'Login failed'}catch{document.getElementById('error').textContent='Connection failed'}finally{b.disabled=false}})</script></body></html>
