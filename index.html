<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixIt Guides | Laptop Repair Database</title>
  <style>
    :root {
      --bg-base: #121212;
      --bg-panel: #1e1e1e;
      --bg-card: #252526;
      --border: #333333;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
      --accent: #007bff;
      --accent-hover: #0056b3;
      --alert: #ef4444;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-base); color: var(--text-main); font-family: var(--font-ui); overflow: hidden; display: flex; height: 100vh; }
    
    /* --- SIDEBAR --- */
    #sidebar { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .logo-area { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .logo-icon { color: var(--accent); }
    
    .nav-list { overflow-y: auto; flex: 1; padding-top: 1rem; }
    .nav-item { padding: 0.6rem 1.5rem; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; transition: all 0.1s; border-left: 3px solid transparent; }
    .nav-item:hover { background: var(--bg-card); color: var(--text-main); }
    .nav-item.active { background: rgba(0, 123, 255, 0.1); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

    /* --- MAIN ARTICLE AREA --- */
    #main-content { flex: 1; overflow-y: auto; padding: 2rem 3rem; position: relative; padding-bottom: 120px; }
    .article-container { max-width: 800px; margin: 0 auto; }
    
    .breadcrumb { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
    .breadcrumb span { color: var(--accent); cursor: pointer; }
    .breadcrumb span:hover { text-decoration: underline; }
    
    .article-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.75rem; line-height: 1.2; }
    .article-meta { display: flex; gap: 1rem; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    
    .hero-image { width: 100%; height: 350px; background-size: cover; background-position: center; border-radius: 8px; margin-bottom: 2rem; border: 1px solid var(--border); background-color: #000; }

    .spec-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
    .spec-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    .spec-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #2d3139; font-size: 0.9rem; }
    .spec-row:last-child { border-bottom: none; }
    .spec-label { color: var(--text-muted); }
    .spec-value { font-family: var(--font-mono); font-weight: 600; }

    .step { margin-bottom: 2.5rem; }
    .step-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 10px; }
    .step-num { background: var(--accent); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; flex-shrink: 0; }
    .step-body { background: var(--bg-card); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); line-height: 1.7; color: #d1d5db; font-size: 0.95rem; }
    .step-body ul { margin-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .step-body li { margin-bottom: 0.5rem; }
    .warning-box { background: rgba(255, 153, 0, 0.1); border-left: 4px solid #ff9900; padding: 1rem; margin-bottom: 1.5rem; border-radius: 4px; color: #ffd699; font-size: 0.9rem; }

    /* Sub-guide links */
    .guide-links { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .guide-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 1rem; border-radius: 6px; cursor: pointer; flex: 1; text-align: center; font-weight: 600; color: var(--text-main); transition: all 0.2s; min-width: 180px; }
    .guide-btn:hover { border-color: var(--accent); background: rgba(0, 123, 255, 0.05); }

    /* --- CHAT WIDGET --- */
    #chat-widget { position: fixed; bottom: 20px; right: 20px; width: 320px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; z-index: 1000; transition: all 0.2s ease-in-out; }
    #chat-widget.minimized { height: 46px; overflow: hidden; cursor: pointer; }
    #chat-widget.minimized .widget-body { display: none; }
    #chat-widget.minimized #login-screen { display: none; }
    
    .widget-header { background: var(--bg-card); padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .widget-title { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
    .status-dot.alert { background: var(--alert); box-shadow: 0 0 8px var(--alert); }
    
    .minimize-btn { font-size: 1.2rem; color: var(--text-muted); font-weight: bold; line-height: 1; }
    
    .widget-body { display: flex; flex-direction: column; height: 300px; }
    .widget-channels { display: flex; gap: 4px; padding: 0.5rem; border-bottom: 1px solid var(--border); overflow-x: auto; background: var(--bg-base); }
    .w-channel { font-size: 0.7rem; padding: 4px 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); cursor: pointer; white-space: nowrap; position: relative; }
    .w-channel.active { background: var(--accent); color: white; border-color: var(--accent); }
    
    .unread-dot { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; background: var(--alert); border-radius: 50%; display: none; }
    .unread-dot.show { display: block; }

    #messages { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { display: flex; flex-direction: column; }
    .msg-author { font-size: 0.7rem; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
    .msg-text { font-size: 0.8rem; background: var(--bg-base); padding: 0.4rem 0.6rem; border-radius: 4px; border: 1px solid var(--border); color: var(--text-main); word-wrap: break-word; }
    
    #composer { padding: 0.5rem; border-top: 1px solid var(--border); background: var(--bg-card); border-radius: 0 0 8px 8px; }
    #composer form { display: flex; gap: 0.5rem; }
    #composer input { flex: 1; background: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); padding: 0.4rem; border-radius: 4px; outline: none; font-size: 0.8rem; }
    #composer input:focus { border-color: var(--accent); }
    #composer button { background: var(--accent); color: white; border: none; border-radius: 4px; padding: 0 0.75rem; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    #composer button:hover { background: var(--accent-hover); }
    #composer button:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="logo-area"><span class="logo-icon">🛠️</span> FixIt Guides</div>
    <div class="nav-list" id="brand-list">
      <!-- Brands injected here -->
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-content">
    <div class="article-container" id="article-content">
      <!-- Article injected here -->
    </div>
  </div>

  <!-- CHAT WIDGET -->
  <div id="chat-widget" class="minimized">
    <div class="widget-header" onclick="toggleWidget()">
      <div class="widget-title"><div class="status-dot" id="main-status-dot"></div> Live Support</div>
      <div class="minimize-btn" id="toggle-icon">+</div>
    </div>
    
    <div id="login-screen" style="padding: 2rem 1rem; display: flex; flex-direction: column; gap: 0.75rem; align-items: center; background: var(--bg-base);">
      <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">🔒</div>
      <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 0.5rem;">Technician login required.</p>
      <input type="text" placeholder="Username" style="width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); color: white; font-size: 0.85rem; outline: none;" />
      <input type="password" id="auth-password" placeholder="Password" style="width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); color: white; font-size: 0.85rem; outline: none;" />
      <button onclick="login()" style="width: 100%; background: var(--accent); color: white; border: none; padding: 0.6rem; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem;">Log In</button>
      <p id="login-error" style="color: #ef4444; font-size: 0.75rem; display: none;">Invalid credentials.</p>
    </div>

    <div class="widget-body" id="chat-interface" style="display: none;">
      <div class="widget-channels" id="channel-list">
        <!-- Channels injected here -->
      </div>
      <div id="messages">
        <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1rem;">Select a channel to connect.</div>
      </div>
      <div id="composer">
        <form id="send-form">
          <input id="message-input" type="text" placeholder="Ask a tech..." autocomplete="off" disabled />
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '';
    
    // ==========================================
    // 1. DISCORD CHANNELS
    // ==========================================
    const CHANNELS = {
      "general": "1295177296080142360",
      "gaming": "1295177296080142361",
      "joins-leaves": "1550173910585319454",
      "commands": "1550225576147820634",
      "Lobby": "1548458810388127794",
      "Survival": "1548459448224456704",
      "gen": "1009221242487832656"

    // ==========================================
    // 2. STATIC REPAIR GUIDES (Full written guides)
    // ==========================================
    const REPAIR_GUIDES = {
      "lenovo": {

        },
        screen: { 
          title: "Lenovo ThinkPad Screen Replacement", 
          text: "1. Remove the bottom cover to disconnect the internal battery (crucial for safety). 2. Use a plastic pry tool to separate the display bezel from the LCD panel, starting at the bottom corners. 3. Remove the four screws holding the LCD panel to the hinges. 4. Carefully lay the panel face down on the keyboard. 5. Peel back the tape and disconnect the wide display ribbon cable. 6. Remove the panel and install the replacement, reconnecting the cable and screwing it into the hinges." 
        },
        drive: { 
          title: "Lenovo ThinkPad Hard Drive Replacement", 
          text: "1. Remove the bottom cover. 2. The M.2 SSD is located under a silver thermal shield. Remove the single screw holding the shield in place. 3. Lift the shield and remove the single screw at the end of the SSD. 4. The drive will pop up at a 30-degree angle. Pull it straight out of the slot. 5. Insert the new drive at the same angle, push it down, and secure it with the screw." 
        }
      },
      "asus": {
        name: "ASUS", 
        // Accurate: ROG Zephyrus angular chassis
        image: "https://images.unsplash.com/photo-1589739900266-43b2843f4c12?q=80&w=1200&auto=format&fit=crop",
        battery: { 
          title: "ASUS ROG Battery Replacement", 
          text: "1. Remove the 10-12 Phillips screws from the bottom panel. Note that some screws may be different lengths; keep track of their positions. 2. Pry the bottom panel off starting from the front edge. 3. Disconnect the battery connector from the motherboard by gently sliding it out. 4. Remove the 6 screws holding the battery in place. 5. Lift the battery out and replace it." 
        },
        screen: { 
          title: "ASUS ROG Screen Replacement", 
          text: "1. Disconnect the battery. 2. Remove the rubber screw covers on the bottom bezel, then remove the screws underneath. 3. Use a guitar pick to pry the bezel away from the screen. 4. Remove the four screws holding the LCD panel. 5. Tilt the screen forward and disconnect the display cable. 6. Remove the panel and install the new one." 
        },
        drive: { 
          title: "ASUS ROG Hard Drive Replacement", 
          text: "1. Remove the bottom panel. 2. Locate the M.2 SSD, which is usually wrapped in a black thermal shield. 3. Remove the screw holding the shield and peel it back. 4. Remove the screw at the end of the SSD. 5. Pull the drive out and replace it." 
        }
      },
      "dell": {
        name: "Dell", 
        // Accurate: Dell XPS carbon fiber interior
        image: "https://images.unsplash.com/photo-1593642632823-8f785ba67e45?q=80&w=1200&auto=format&fit=crop",
        battery: { 
          title: "Dell XPS Battery Replacement", 
          text: "1. Loosen the 8 captive screws on the bottom cover (they stay attached to the cover). 2. Lift the cover from the hinge. 3. Unplug the battery cable from the motherboard. 4. Remove the 4-6 Phillips screws holding the battery down. 5. Lift the battery out." 
        },
        screen: { 
          title: "Dell XPS Screen Replacement", 
          text: "1. Disconnect the battery. 2. Use a plastic pry tool to separate the bezel from the LCD panel, starting at the bottom corners. 3. Remove the 4 corner screws holding the panel. 4. Lay the panel face down. 5. Disconnect the video cable by lifting the metal latch. 6. Remove the panel and replace it."

        drive: {

          text: "1. Remove the bottom cover. 2. The SSD is located under a metal shield. Remove the shield screw and lift the shield. 3. Remove the screw at the end of the SSD. 4. Slide the drive out and replace it."

      },
      "hp": {
        name: "HP", 
        // Accurate: HP Omen angular design
        image: "https://images.unsplash.com/photo-1593642702821-c8da6771f0c6?q=80&w=1200&auto=format&fit=crop",
        battery: { 
          title: "HP Omen Battery Replacement", 
          text: "1. Remove the 6-8 bottom cover screws. 2. Use a pry tool to pop the case open, starting near the hinges. 3. Disconnect the battery connector from the motherboard. 4. Remove the mounting screws and lift the battery." 
        },
        screen: { 
          title: "HP Omen Screen Replacement", 
          text: "1. Disconnect the battery. 2. Remove the display bezel by prying around the edges. 3. Unscrew the LCD panel. 4. Carefully disconnect the display cable. 5. Remove the panel and replace it." 
        },
        drive: { 
          title: "HP Omen Hard Drive Replacement", 
          text: "1. Remove the bottom panel. 2. Locate the M.2 slot. 3. Remove the retention screw. 4. Pull the drive out at a 30-degree angle. 5. Replace and secure." 
        }
      },
      "acer": {
        name: "Acer", 
        // Accurate: Acer Nitro red accents
        image: "https://images.unsplash.com/photo-1603302576837-37561b2e2302?q=80&w=1200&auto=format&fit=crop",
        battery: { 
          title: "Acer Nitro Battery Replacement", 
          text: "1. Remove all bottom case screws. 2. Pry the bottom case off. 3. Disconnect the battery cable. 4. Remove the screws holding the battery in place. 5. Lift the battery out." 
        },
        screen: { 
          title: "Acer Nitro Screen Replacement", 
          text: "1. Disconnect the battery. 2. Pop the bezel off using a guitar pick. 3. Remove the hinge screws. 4. Disconnect the display cable. 5. Lift the screen assembly out and replace." 
        },
        drive: { 
          title: "Acer Nitro Hard Drive Replacement", 
          text: "1. Open the bottom case. 2. Remove the single screw holding the M.2 SSD. 3. Pull it out to replace it." 
        }
      },
      "razer": {
        name: "Razer", 
        // Accurate: Razer Blade black chassis green USB ports
        image: "https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?q=80&w=1200&auto=format&fit=crop",
        battery: { 
          title: "Razer Blade Battery Replacement", 
          text: "1. Remove the 10 T5 Torx screws on the bottom. 2. Carefully lift the bottom panel from the front edge. 3. Disconnect the battery cable. 4. Remove the 6 screws holding the massive battery. 5. Lift the battery out." 
        },
        screen: { 
          title: "Razer Blade Screen Replacement", 
          text: "1. Disconnect the battery. 2. Remove the rubber bezel carefully. 3. Unscrew the hinges. 4. Disconnect the display cable. 5. Remove the panel and replace it." 
        },
        drive: { 
          title: "Razer Blade Hard Drive Replacement", 
          text: "1. Remove the bottom case. 2. The SSD is covered by a black shield. 3. Peel the shield back, remove the screw, and replace the drive." 
        }
      },
      "samsung": {
        name: "Samsung", 
        // Accurate: Samsung Galaxy Book sleek silver
        image: "https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?q=80&w=1200&auto=format&fit=crop",
        battery: { 
          title: "Samsung Galaxy Book Battery Replacement", 
          text: "1. Remove the bottom cover screws. 2. Use a plastic tool to pop the clips around the edge. 3. Disconnect the battery. 4. Remove the screws holding the battery. 5. Lift it out." 
        },
        screen: { 
          title: "Samsung Galaxy Book Screen Replacement", 
          text: "1. Disconnect the battery. 2. Pry off the display bezel. 3. Disconnect the display cable. 4. Unscrew the panel and remove it." 
        },
        drive: { 
          title: "Samsung Galaxy Book Hard Drive Replacement", 
          text: "1. Remove the back panel. 2. Unscrew the SSD retention screw. 3. Pull the drive out and replace it." 
        }
      },
      "surface": {
        name: "Surface", 
        // Accurate: Surface Pro kickstand
        image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=1200&auto=format&fit=crop",
        battery: { 
          title: "Surface Pro Battery Replacement", 
          text: "WARNING: Surface devices are glued shut. 1. Use a heat gun to soften the adhesive on the screen edges. 2. Pry the screen off carefully. 3. Disconnect the battery. 4. Use a solvent (like isopropyl alcohol) to dissolve the adhesive holding the battery. 5. Carefully pry the battery out." 
        },
        screen: { 
          title: "Surface Pro Screen Replacement", 
          text: "1. Heat the edges of the screen. 2. Use a suction cup and plastic cards to cut through the adhesive. 3. Carefully lift the screen. 4. Disconnect the screen cables. 5. Remove the display and install the new one." 
        },
        drive: { 
          title: "Surface Pro Hard Drive Replacement", 
          text: "1. Remove the kickstand. 2. Under the kickstand, there is a small door. 3. Pry it open to access the M.2 SSD. 4. Remove the single screw and swap the drive." 
        }
      }
    };

    // ==========================================
    // 3. RENDERING LOGIC
    // ==========================================
    
    const brandListEl = document.getElementById('brand-list');
    Object.keys(REPAIR_GUIDES).forEach((brand, index) => {
      const div = document.createElement('div');
      div.className = `nav-item ${index === 0 ? 'active' : ''}`;
      div.textContent = REPAIR_GUIDES[brand].name;
      div.onclick = () => loadBrandOverview(brand, div);
      brandListEl.appendChild(div);
    });

    function loadBrandOverview(brandKey, element) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      const guide = REPAIR_GUIDES[brandKey];
      const articleContainer = document.getElementById('article-content');

      articleContainer.innerHTML = `
        <div class="breadcrumb">Home / Laptop Repair / <span>${guide.name}</span></div>
        <h1 class="article-title">${guide.name} Repair Guides</h1>
        <div class="article-meta"><span>Written By: FixIt Staff</span><span>|</span><span>Select a guide below</span></div>
        <div class="hero-image" style="background-image: url('${guide.image}');"></div>

        <div class="guide-links">
          <div class="guide-btn" onclick="loadSubGuide('${brandKey}', 'battery', this)">🔋 Battery Replacement</div>
          <div class="guide-btn" onclick="loadSubGuide('${brandKey}', 'screen', this)">🖥️ Screen Replacement</div>
          <div class="guide-btn" onclick="loadSubGuide('${brandKey}', 'drive', this)">💾 Hard Drive Replacement</div>
        </div>
      `;
      document.getElementById('main-content').scrollTop = 0;
    }

    function loadSubGuide(brandKey, partKey, element) {
      const guide = REPAIR_GUIDES[brandKey][partKey];
      const brandData = REPAIR_GUIDES[brandKey];
      const articleContainer = document.getElementById('article-content');

      articleContainer.innerHTML = `
        <div class="breadcrumb">Home / Laptop Repair / <span onclick="loadBrandOverview('${brandKey}')">${brandData.name}</span> / ${guide.title}</div>
        <h1 class="article-title">${guide.title}</h1>
        <div class="article-meta"><span>Written By: FixIt Staff</span><span>|</span><span>Difficulty: Moderate</span></div>
        <div class="hero-image" style="background-image: url('${brandData.image}');"></div>

        <div class="step">
          <div class="step-title"><span class="step-num">1</span> Full Step-by-Step Guide</div>
          <div class="step-body">${guide.text}</div>
        </div>
      `;
      document.getElementById('main-content').scrollTop = 0;
    }

    loadBrandOverview('lenovo', document.querySelector('.nav-item'));

    // ==========================================
    // 4. CHAT WIDGET LOGIC
    // ==========================================
    let currentChannel = null;
    let eventSource = null;
    let savedPassword = ""; 

    const channelListEl = document.getElementById('channel-list');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('message-input');
    const formEl = document.getElementById('send-form');
    const sendBtn = document.getElementById('send-btn');
    const widgetEl = document.getElementById('chat-widget');
    const toggleIcon = document.getElementById('toggle-icon');
    const mainStatusDot = document.getElementById('main-status-dot');

    function toggleWidget() {
      if (document.activeElement === inputEl) return;
      if (widgetEl.classList.contains('minimized')) {
        widgetEl.classList.remove('minimized');
        toggleIcon.textContent = '-';
      } else {
        widgetEl.classList.add('minimized');
        toggleIcon.textContent = '+';
      }
    }

    function login() {
      const pwd = document.getElementById('auth-password').value;
      fetch(`${API_URL}/api/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      }).then(res => {
        if (!res.ok) {
          document.getElementById('login-error').style.display = 'block';
        } else {
          savedPassword = pwd;
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('chat-interface').style.display = 'flex';
          widgetEl.classList.remove('minimized');
          toggleIcon.textContent = '-';
          
          startListening();
          initChat(); 
        }
      }).catch(err => {
        document.getElementById('login-error').textContent = "Server error. Try again.";
        document.getElementById('login-error').style.display = 'block';
      });
    }

    function startListening() {
      if (!eventSource) {
        eventSource = new EventSource(`${API_URL}/api/stream`);
        eventSource.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.channel === currentChannel) {
             appendMessage(msg);
          } else {
             const dot = document.getElementById(`dot-${msg.channel}`);
             if (dot) dot.classList.add('show');
             mainStatusDot.classList.add('alert');
          }
        };
      }
    }

    function initChat() {
      Object.keys(CHANNELS).forEach(channelName => {
        const div = document.createElement('div');
        div.className = 'w-channel';
        div.id = `chan-${channelName}`;
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = channelName.substring(0, 6);
        
        const dot = document.createElement('div');
        dot.className = 'unread-dot';
        dot.id = `dot-${channelName}`;
        
        div.appendChild(nameSpan);
        div.appendChild(dot);
        div.title = channelName;
        div.onclick = () => selectChannel(channelName, div);
        channelListEl.appendChild(div);
      });

      const firstChannel = Object.keys(CHANNELS)[0];
      selectChannel(firstChannel, document.getElementById(`chan-${firstChannel}`));
    }

    function selectChannel(channelName, element) {
      currentChannel = channelName;
      
      document.querySelectorAll('.w-channel').forEach(el => {
        el.classList.toggle('active', el === element);
      });
      
      document.getElementById(`dot-${channelName}`).classList.remove('show');
      mainStatusDot.classList.remove('alert');
      
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
      
      messagesEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1rem;">Connecting...</div>';
      loadMessages();
    }

    async function loadMessages() {
      if (!currentChannel) return;
      try {
        const res = await fetch(`${API_URL}/api/messages?channel=${currentChannel}`);
        const data = await res.json();
        
        messagesEl.innerHTML = '';
        if (data.length === 0) {
            messagesEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1rem;">No messages yet.</div>';
        } else {
            data.forEach(appendMessage);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      } catch (err) {
        messagesEl.innerHTML = '<div style="text-align: center; color: #ef4444; font-size: 0.8rem; padding: 1rem;">Connection error.</div>';
      }
    }

    function appendMessage(msg) {
      if (document.querySelector(`[data-id="${msg.id}"]`)) return;

      const div = document.createElement('div');
      div.className = 'msg';
      div.dataset.id = msg.id;
      
      const safeContent = msg.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      
      div.innerHTML = `
        <div class="msg-author">${msg.author}</div>
        <div class="msg-text">${safeContent}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = inputEl.value.trim();
      if (!content || !currentChannel) return;
      
      inputEl.value = ''; 
      
      try {
        const res = await fetch(`${API_URL}/api/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            content, 
            channel: currentChannel,
            password: savedPassword 
          })
        });
        if (!res.ok) alert("Error: Connection timed out.");
      } catch (err) {
        console.error('Failed to send', err);
      }
    });
  </script>
</body>
</html>
