<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StowawayTech | API Reference</title>
  <style>
    :root {
      --bg-base: #ffffff;
      --bg-sidebar: #f8f9fa;
      --bg-code: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #0f172a;
      --accent-blue: #2563eb;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: var(--bg-base); color: var(--text-main); font-family: var(--font-sans); overflow: hidden; }
    
    /* Sidebar - Navigation */
    #sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 1.1rem; color: var(--accent); letter-spacing: -0.5px; }
    .sidebar-section { padding: 1.5rem 1rem 0.5rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    
    .channel-list { padding: 0 0.5rem; overflow-y: auto; flex: 1; }
    .channel { padding: 0.5rem 1rem; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; border-radius: 4px; font-family: var(--font-mono); transition: all 0.1s; }
    .channel:hover { background: #e2e8f0; color: var(--text-main); }
    .channel.active { background: #e2e8f0; color: var(--accent-blue); font-weight: 600; }
    
    /* Main Content Area */
    #main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    
    /* Header */
    #header { padding: 2rem 3rem; border-bottom: 1px solid var(--border); }
    #header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 0.5rem; }
    .endpoint-badge { display: inline-flex; align-items: center; background: var(--bg-code); border: 1px solid var(--border); border-radius: 4px; padding: 0.25rem 0.75rem; font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent-blue); margin-top: 1rem; }
    
    /* Chat/Spec Area */
    #messages { flex: 1; padding: 2rem 3rem; display: flex; flex-direction: column; gap: 1.5rem; background: var(--bg-base); }
    
    .msg { display: flex; flex-direction: column; border-left: 2px solid var(--border); padding-left: 1rem; }
    .msg:hover { border-left-color: var(--accent-blue); }
    
    .msg-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 0.5rem; }
    .msg-author { font-family: var(--font-mono); font-weight: 600; color: var(--text-main); font-size: 0.9rem; }
    .msg-time { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); }
    
    .msg-content { font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-main); line-height: 1.5; background: var(--bg-code); padding: 1rem; border-radius: 6px; border: 1px solid var(--border); white-space: pre-wrap; }
    
    /* Composer */
    #composer { padding: 1.5rem 3rem; background: var(--bg-sidebar); border-top: 1px solid var(--border); }
    #composer form { display: flex; flex-direction: column; gap: 0.75rem; }
    .input-label { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
    .input-group { display: flex; gap: 0.5rem; }
    #composer input { flex: 1; background: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); outline: none; font-size: 0.9rem; padding: 0.75rem 1rem; border-radius: 6px; font-family: var(--font-mono); transition: border-color 0.2s; }
    #composer input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    #composer button { background: var(--text-main); color: white; border: none; border-radius: 6px; padding: 0 1.5rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
    #composer button:hover { background: #0f172a; }
    #composer button:disabled { background: var(--text-muted); cursor: not-allowed; opacity: 0.7; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">StowawayTech API</div>
    <div class="sidebar-section">Endpoints</div>
    <div class="channel-list" id="channel-list">
      <!-- Channels injected here -->
    </div>
  </div>

  <div id="main">
    <div id="header">
      <h1 id="page-title">Select an Endpoint</h1>
      <div class="endpoint-badge" id="endpoint-url" style="display: none;">GET /api/messages?channel=...</div>
    </div>
    
    <div id="messages">
      <div style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.9rem;">// Select a channel to view payload history.</div>
    </div>
    
    <div id="composer">
      <form id="send-form">
        <label class="input-label">Execute Payload</label>
        <div class="input-group">
          <input id="message-input" type="text" placeholder="Enter payload string..." autocomplete="off" disabled />
          <button type="submit" id="send-btn" disabled>Execute</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = '';
    const CHANNELS = {
      "general": "1295177296080142360",
      "gaming": "1295177296080142361",
      "joins-leaves": "1550173910585319454",
      "commands": "1550225576147820634",
      "Lobby": "1548458810388127794",
      "Survival": "1548459448224456704",
      "gen": "1009221242487832656"
    };

    let currentChannel = null;
    let eventSource = null;

    const channelListEl = document.getElementById('channel-list');
    const pageTitleEl = document.getElementById('page-title');
    const endpointUrlEl = document.getElementById('endpoint-url');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('message-input');
    const formEl = document.getElementById('send-form');
    const sendBtn = document.getElementById('send-btn');

    // Render sidebar
    Object.keys(CHANNELS).forEach(channelName => {
      const div = document.createElement('div');
      div.className = 'channel';
      div.textContent = channelName;
      div.onclick = () => selectChannel(channelName);
      channelListEl.appendChild(div);
    });

    function selectChannel(channelName) {
      currentChannel = channelName;
      
      document.querySelectorAll('.channel').forEach(el => {
        el.classList.toggle('active', el.textContent === channelName);
      });
      
      pageTitleEl.textContent = `Channel Reference: ${channelName}`;
      endpointUrlEl.style.display = 'inline-flex';
      endpointUrlEl.textContent = `GET /api/messages?channel=${channelName}`;
      
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
      
      messagesEl.innerHTML = '<div style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.9rem;">// Fetching payloads...</div>';
      loadMessages();

      if (!eventSource) {
        eventSource = new EventSource(`${API_URL}/api/stream`);
        eventSource.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.channel === currentChannel) {
             appendMessage(msg);
          }
        };
      }
    }

    async function loadMessages() {
      if (!currentChannel) return;
      try {
        const res = await fetch(`${API_URL}/api/messages?channel=${currentChannel}`);
        const data = await res.json();
        
        messagesEl.innerHTML = '';
        if (data.length === 0) {
            messagesEl.innerHTML = '<div style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.9rem;">// No payloads found.</div>';
        } else {
            data.forEach(appendMessage);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      } catch (err) {
        messagesEl.innerHTML = '<div style="color: #ef4444; font-family: var(--font-mono); font-size: 0.9rem;">// Error connecting to data stream.</div>';
      }
    }

    function appendMessage(msg) {
      if (document.querySelector(`[data-id="${msg.id}"]`)) return;

      const div = document.createElement('div');
      div.className = 'msg';
      div.dataset.id = msg.id;
      
      const safeContent = msg.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const timeString = new Date(msg.timestamp).toLocaleTimeString([], { hour12: false });
      
      div.innerHTML = `
        <div class="msg-header">
          <span class="msg-author">@${msg.author}</span>
          <span class="msg-time">${timeString}</span>
        </div>
        <div class="msg-content">${safeContent}</div>
      `;
      messagesEl.appendChild(div);
      
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = inputEl.value.trim();
      if (!content || !currentChannel) return;
      
      inputEl.value = ''; 
      
      try {
        const res = await fetch(`${API_URL}/api/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            content, 
            channel: currentChannel,
            password: "mypassword123" // Make sure this matches index.js!
          })
        });
        
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
        }
      } catch (err) {
        console.error('Failed to send', err);
      }
    });
  </script>
</body>
</html>
