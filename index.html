<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Proxy Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; height: 100vh; background: #313338; color: #dbdee1; }
    
    /* Sidebar */
    #sidebar { width: 250px; background: #2b2d31; padding: 1rem 0; display: flex; flex-direction: column; }
    .channel { padding: 0.5rem 1rem; cursor: pointer; color: #949ba4; border-radius: 4px; margin: 2px 8px; }
    .channel:hover { background: #35373c; color: #dbdee1; }
    .channel.active { background: #404249; color: #fff; font-weight: 600; }
    
    /* Main Chat Area */
    #main { flex: 1; display: flex; flex-direction: column; }
    #header { padding: 1rem; border-bottom: 1px solid #1e1f22; font-weight: bold; font-size: 1.1rem; background: #313338; }
    
    #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { display: flex; flex-direction: column; }
    .msg-author { font-weight: 600; color: #f2f3f5; margin-bottom: 2px; }
    .msg-time { font-size: 0.75rem; color: #949ba4; margin-left: 8px; font-weight: normal; }
    .msg-content { color: #dbdee1; line-height: 1.4; word-wrap: break-word; }
    
    /* Composer */
    #composer { padding: 1rem; background: #313338; }
    #composer form { display: flex; background: #383a40; border-radius: 8px; padding: 0.5rem 1rem; }
    #composer input { flex: 1; background: transparent; border: none; color: #dbdee1; outline: none; font-size: 1rem; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div style="padding: 0 1rem 1rem; font-weight: bold; color: #f2f3f5;">Channels</div>
    <!-- Channels will be injected here by JS -->
  </div>

  <div id="main">
    <div id="header">Select a channel</div>
    <div id="messages"></div>
    <div id="composer">
      <form id="send-form">
        <input id="message-input" type="text" placeholder="Message..." autocomplete="off" disabled />
      </form>
    </div>
  </div>

  <script>
    // Configuration
    const API_URL = 'https://stowawaytech.onrender.com';
    const CHANNELS = {
      "general": "1295177296080142360",
      "gaming": "1295177296080142361",
      "joins-leaves": "1550173910585319454",
      "commands": "1550225576147820634",
      "Lobby": "1548458810388127794",
      "Survival": "1548459448224456704",
      "gen": "1009221242487832656"
    };

    let currentChannel = null;
    let eventSource = null;

    const sidebarEl = document.getElementById('sidebar');
    const headerEl = document.getElementById('header');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('message-input');
    const formEl = document.getElementById('send-form');

    // Render sidebar
    Object.keys(CHANNELS).forEach(channelName => {
      const div = document.createElement('div');
      div.className = 'channel';
      div.textContent = '# ' + channelName;
      div.onclick = () => selectChannel(channelName);
      sidebarEl.appendChild(div);
    });

    function selectChannel(channelName) {
      currentChannel = channelName;
      
      document.querySelectorAll('.channel').forEach(el => {
        el.classList.toggle('active', el.textContent === '# ' + channelName);
      });
      headerEl.textContent = '# ' + channelName;
      inputEl.disabled = false;
      inputEl.focus();
      
      messagesEl.innerHTML = '';
      loadMessages();

      // Connect to live stream if not already connected
      if (!eventSource) {
        eventSource = new EventSource(`${API_URL}/api/stream`);
        eventSource.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          // Only render if it belongs to the channel we are looking at
          if (msg.channel === currentChannel) {
             appendMessage(msg);
          }
        };
      }
    }

    async function loadMessages() {
      if (!currentChannel) return;
      try {
        const res = await fetch(`${API_URL}/api/messages?channel=${currentChannel}`);
        const data = await res.json();
        
        messagesEl.innerHTML = '';
        data.forEach(appendMessage);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } catch (err) {
        console.error('Failed to load messages', err);
      }
    }

    function appendMessage(msg) {
      // Prevent duplicates
      if (document.querySelector(`[data-id="${msg.id}"]`)) return;

      const div = document.createElement('div');
      div.className = 'msg';
      div.dataset.id = msg.id;
      
      const safeContent = msg.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      
      div.innerHTML = `
        <div class="msg-author">${msg.author} <span class="msg-time">${new Date(msg.timestamp).toLocaleTimeString()}</span></div>
        <div class="msg-content">${safeContent}</div>
      `;
      messagesEl.appendChild(div);
      
      // Auto-scroll only if we are near the bottom
      if (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = inputEl.value.trim();
      if (!content || !currentChannel) return;
      
      inputEl.value = ''; 
      
      try {
        const res = await fetch(`${API_URL}/api/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            content, 
            channel: currentChannel,
            password: "mypassword123" // Match this with the backend!
          })
        });
        
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
        }
      } catch (err) {
        console.error('Failed to send', err);
      }
    });
  </script>
</body>
</html>
