<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiliconDB | Hardware Benchmarks</title>
  <style>
    :root {
      --bg-base: #0f1115;
      --bg-panel: #16181d;
      --bg-card: #1c1f26;
      --border: #2d3139;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.15);
      --success: #10b981;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --font-mono: "Consolas", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: var(--bg-base); color: var(--text-main); font-family: var(--font-ui); overflow: hidden; }
    
    /* Top Header */
    #top-bar { position: absolute; top: 0; left: 0; right: 0; height: 64px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; z-index: 10; }
    .logo { font-size: 1.25rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px; }
    .logo-icon { color: var(--accent); font-size: 1.5rem; }
    .search-bar { width: 450px; padding: 0.6rem 1.2rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-base); font-size: 0.9rem; color: var(--text-muted); outline: none; }
    .search-bar:focus { border-color: var(--accent); }
    
    /* Layout */
    #app-container { display: flex; width: 100%; margin-top: 64px; height: calc(100vh - 64px); }
    
    /* Sidebar - Components */
    #sidebar { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 1.5rem 1rem 0.5rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    
    .channel-list { overflow-y: auto; flex: 1; padding: 0 0.5rem; }
    .channel { padding: 0.7rem 1rem; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; border-radius: 4px; margin-bottom: 2px; display: flex; align-items: center; gap: 10px; transition: all 0.1s; font-weight: 500; }
    .channel:hover { background: var(--bg-card); color: var(--text-main); }
    .channel.active { background: var(--accent-glow); color: var(--accent); border-left: 3px solid var(--accent); }
    
    /* Main Content Area - Spec Sheet / Reviews */
    #main { flex: 1; display: flex; flex-direction: column; background: var(--bg-base); overflow-y: auto; }
    
    /* Header */
    #header { padding: 2rem 3rem; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
    #header h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
    
    /* Visual Specs Area */
    #visual-specs { display: flex; gap: 1.5rem; margin-top: 1.5rem; }
    .spec-image-container { width: 250px; height: 150px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .spec-image-container img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.2s; }
    .spec-image-container:hover img { opacity: 1; }
    .spec-image-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-family: var(--font-mono); color: white; }
    
    .spec-details { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
    .spec-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 0.9rem; }
    .spec-label { color: var(--text-muted); }
    .spec-value { font-weight: 600; font-family: var(--font-mono); color: var(--text-main); }
    
    /* Review/Log Table */
    #messages { padding: 2rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
    
    .review-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .review-author { font-size: 0.95rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .user-badge { font-size: 0.7rem; background: var(--success); color: white; padding: 3px 8px; border-radius: 4px; font-weight: 700; letter-spacing: 0.5px; }
    .review-date { font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-mono); }
    
    .review-body { font-family: var(--font-ui); font-size: 0.95rem; color: #cbd5e1; line-height: 1.6; background: var(--bg-base); padding: 1rem; border-radius: 6px; border: 1px solid var(--border); white-space: pre-wrap; }
    
    /* Composer */
    #composer { padding: 1.5rem 3rem; background: var(--bg-panel); border-top: 1px solid var(--border); }
    #composer form { display: flex; gap: 1rem; }
    #composer input { flex: 1; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-base); color: var(--text-main); outline: none; font-family: var(--font-ui); font-size: 0.95rem; transition: border-color 0.2s; }
    #composer input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    #composer button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 0 1.5rem; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
    #composer button:hover { background: #2563eb; }
    #composer button:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; opacity: 0.6; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="logo"><span class="logo-icon">⛁</span> SiliconDB</div>
    <input type="text" class="search-bar" placeholder="Search CPU, GPU, Motherboard specs..." disabled>
  </div>

  <div id="app-container">
    <div id="sidebar">
      <div class="sidebar-header">Hardware Categories</div>
      <div class="channel-list" id="channel-list">
        <!-- Channels injected here -->
      </div>
    </div>

    <div id="main">
      <div id="header">
        <h2 id="page-title">Select a Component</h2>
        
        <!-- Fake Spec Sheet Area -->
        <div id="visual-specs" style="display: none;">
          <div class="spec-image-container">
            <!-- Rotating hardware images -->
            <img id="hardware-img" src="https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?q=80&w=600&auto=format&fit=crop" alt="Hardware">
            <div class="spec-image-label" id="img-label">CPU ARCHITECTURE</div>
          </div>
          <div class="spec-details">
            <div class="spec-row"><span class="spec-label">Node Type</span><span class="spec-value" id="spec-type">x86-64</span></div>
            <div class="spec-row"><span class="spec-label">Status</span><span class="spec-value" style="color: var(--success);">ONLINE</span></div>
            <div class="spec-row"><span class="spec-label">Data Transfer</span><span class="spec-value">Active Stream</span></div>
          </div>
        </div>
      </div>
      
      <div id="messages">
        <div style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.9rem;">// Select a category to view benchmark logs.</div>
      </div>
      
      <div id="composer">
        <form id="send-form">
          <input id="message-input" type="text" placeholder="Submit new benchmark result..." autocomplete="off" disabled />
          <button type="submit" id="send-btn" disabled>Submit Log</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '';
    const CHANNELS = {
      "general": "1295177296080142360",
      "gaming": "1295177296080142361",
      "joins-leaves": "1550173910585319454",
      "commands": "1550225576147820634",
      "Lobby": "1548458810388127794",
      "Survival": "1548459448224456704",
      "gen": "1009221242487832656"
    };

    // Array of realistic hardware images from Unsplash to rotate through
    const HARDWARE_IMAGES = [
      { url: "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?q=80&w=600&auto=format&fit=crop", label: "CPU ARCHITECTURE" },
      { url: "https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=600&auto=format&fit=crop", label: "MOTHERBOARD" },
      { url: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?q=80&w=600&auto=format&fit=crop", label: "LAPTOP CHASSIS" },
      { url: "https://images.unsplash.com/photo-1555617981-dac3880eac6e?q=80&w=600&auto=format&fit=crop", label: "THERMAL DYNAMICS" },
      { url: "https://images.unsplash.com/photo-1591488320449-011701bb6704?q=80&w=600&auto=format&fit=crop", label: "MEMORY MODULES" }
    ];

    let currentChannel = null;
    let eventSource = null;

    const channelListEl = document.getElementById('channel-list');
    const pageTitleEl = document.getElementById('page-title');
    const visualSpecsEl = document.getElementById('visual-specs');
    const hardwareImgEl = document.getElementById('hardware-img');
    const imgLabelEl = document.getElementById('img-label');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('message-input');
    const formEl = document.getElementById('send-form');
    const sendBtn = document.getElementById('send-btn');

    // Render sidebar
    Object.keys(CHANNELS).forEach((channelName, index) => {
      const div = document.createElement('div');
      div.className = 'channel';
      // Format "joins-leaves" to "Joins Leaves"
      const formattedName = channelName.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      div.textContent = formattedName;
      div.onclick = () => selectChannel(channelName, formattedName);
      channelListEl.appendChild(div);
    });

    function selectChannel(channelName, formattedName) {
      currentChannel = channelName;
      
      document.querySelectorAll('.channel').forEach(el => {
        el.classList.toggle('active', el.textContent === formattedName);
      });
      
      pageTitleEl.textContent = `${formattedName} Logs`;
      visualSpecsEl.style.display = 'flex';
      
      // Cycle through the hardware images based on which channel is clicked
      const imgIndex = Object.keys(CHANNELS).indexOf(channelName) % HARDWARE_IMAGES.length;
      hardwareImgEl.src = HARDWARE_IMAGES[imgIndex].url;
      imgLabelEl.textContent = HARDWARE_IMAGES[imgIndex].label;
      
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
      
      messagesEl.innerHTML = '<div style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem;">Loading database entries...</div>';
      loadMessages();

      if (!eventSource) {
        eventSource = new EventSource(`${API_URL}/api/stream`);
        eventSource.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.channel === currentChannel) {
             appendMessage(msg);
          }
        };
      }
    }

    async function loadMessages() {
      if (!currentChannel) return;
      try {
        const res = await fetch(`${API_URL}/api/messages?channel=${currentChannel}`);
        const data = await res.json();
        
        messagesEl.innerHTML = '';
        if (data.length === 0) {
            messagesEl.innerHTML = '<div style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem;">No benchmark logs found.</div>';
        } else {
            data.forEach(appendMessage);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      } catch (err) {
        messagesEl.innerHTML = '<div style="color: #ef4444; font-family: var(--font-mono); font-size: 0.85rem;">Error connecting to spec database.</div>';
      }
    }

    function appendMessage(msg) {
      if (document.querySelector(`[data-id="${msg.id}"]`)) return;

      const div = document.createElement('div');
      div.className = 'review-card';
      div.dataset.id = msg.id;
      
      const safeContent = msg.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const timeString = new Date(msg.timestamp).toLocaleString([], { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      
      // Generate a random fake benchmark score based on the message length
      const fakeScore = 1000 + (msg.content.length * 37) % 5000;
      
      div.innerHTML = `
        <div class="review-header">
          <div class="review-author">
            <span class="user-badge">VERIFIED</span> 
            ${msg.author}
          </div>
          <div class="review-date">Benchmark Score: ${fakeScore} pts | ${timeString}</div>
        </div>
        <div class="review-body">${safeContent}</div>
      `;
      messagesEl.appendChild(div);
      
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = inputEl.value.trim();
      if (!content || !currentChannel) return;
      
      inputEl.value = ''; 
      
      try {
        const res = await fetch(`${API_URL}/api/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            content, 
            channel: currentChannel,
            password: "mypassword123" // Make sure this matches index.js!
          })
        });
        
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
        }
      } catch (err) {
        console.error('Failed to send', err);
      }
    });
  </script>
</body>
</html>
