<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixIt Guides | Teardown & Repair</title>
  <style>
    :root {
      --bg-base: #121212;
      --bg-panel: #1e1e1e;
      --bg-card: #252526;
      --border: #333333;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
      --accent: #007bff; /* iFixit-style blue */
      --accent-hover: #0056b3;
      --warning: #ff9900;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-base); color: var(--text-main); font-family: var(--font-ui); overflow-y: scroll; }
    
    /* Top Navigation */
    #top-nav { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo-icon { color: var(--accent); font-size: 1.6rem; }
    .search-bar { background: var(--bg-card); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 4px; color: var(--text-muted); width: 300px; outline: none; }
    
    /* Layout Container */
    #container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; display: flex; gap: 2rem; }
    
    /* Sidebar - Guides */
    #sidebar { width: 260px; flex-shrink: 0; }
    .sidebar-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 1rem; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .channel-list { display: flex; flex-direction: column; gap: 2px; }
    .channel { padding: 0.6rem 0.75rem; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; border-radius: 4px; font-weight: 500; transition: all 0.1s; display: flex; align-items: center; gap: 10px; }
    .channel:hover { background: var(--bg-card); color: var(--text-main); }
    .channel.active { background: rgba(0, 123, 255, 0.1); color: var(--accent); font-weight: 600; border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0; }
    .channel::before { content: "📄"; font-size: 0.8rem; opacity: 0.7; }
    
    /* Main Content Area */
    #main { flex: 1; min-width: 0; }
    
    /* Header / Hero Area */
    #header { margin-bottom: 2rem; background: var(--bg-panel); padding: 2rem; border-radius: 6px; border: 1px solid var(--border); }
    #page-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
    .meta-bar { display: flex; gap: 1rem; font-size: 0.85rem; color: var(--text-muted); align-items: center; }
    .meta-item { display: flex; align-items: center; gap: 4px; }
    .difficulty { background: var(--warning); color: #000; font-weight: 700; font-size: 0.75rem; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
    
    /* Step Guide (Messages) */
    #messages { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 3rem; }
    
    .step-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; display: flex; gap: 1.5rem; position: relative; }
    .step-card:hover { border-color: var(--accent); }
    
    /* Step Number */
    .step-number { font-size: 2rem; font-weight: 800; color: var(--border); line-height: 1; }
    
    /* Step Content */
    .step-content-wrapper { flex: 1; }
    .step-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
    .step-author { font-weight: 700; color: var(--text-main); font-size: 1rem; display: flex; align-items: center; gap: 8px; }
    .author-badge { font-size: 0.7rem; background: var(--border); color: var(--text-muted); padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
    .step-time { font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-mono); }
    
    .step-body { font-size: 0.95rem; color: #d1d5db; line-height: 1.6; background: var(--bg-base); padding: 1rem; border-radius: 4px; border: 1px solid var(--border); }
    
    /* Composer - Submit Guide */
    #composer { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; margin-bottom: 2rem; }
    #composer h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    #composer h3::before { content: "✎"; color: var(--accent); }
    #composer form { display: flex; flex-direction: column; gap: 0.75rem; }
    #composer input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-base); color: var(--text-main); outline: none; font-family: var(--font-ui); font-size: 0.95rem; transition: border-color 0.2s; }
    #composer input:focus { border-color: var(--accent); }
    #composer button { align-self: flex-start; background: var(--accent); color: white; border: none; border-radius: 4px; padding: 0.6rem 1.5rem; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
    #composer button:hover { background: var(--accent-hover); }
    #composer button:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="top-nav">
    <div class="logo"><span class="logo-icon">🛠️</span> FixIt Guides</div>
    <input type="text" class="search-bar" placeholder="Search repair guides..." disabled>
  </div>

  <div id="container">
    <div id="sidebar">
      <div class="sidebar-header">Teardown Guides</div>
      <div class="channel-list" id="channel-list">
        <!-- Channels injected here -->
      </div>
    </div>

    <div id="main">
      <div id="header">
        <h1 id="page-title">Select a Guide</h1>
        <div class="meta-bar">
          <div class="meta-item"><span class="difficulty">Moderate</span></div>
          <div class="meta-item">|</div>
          <div class="meta-item">Steps: <span id="step-count">0</span></div>
          <div class="meta-item">|</div>
          <div class="meta-item">Author: iFixit Team</div>
        </div>
      </div>
      
      <div id="messages">
        <!-- Steps injected here -->
        <div style="text-align: center; color: var(--text-muted); padding: 3rem;">Select a guide from the left to view steps.</div>
      </div>
      
      <div id="composer">
        <h3>Add a Step</h3>
        <form id="send-form">
          <input id="message-input" type="text" placeholder="Describe the next step in the teardown process..." autocomplete="off" disabled />
          <button type="submit" id="send-btn" disabled>Post Step</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '';
    const CHANNELS = {
      "general": "1295177296080142360",
      "gaming": "1295177296080142361",
      "joins-leaves": "1550173910585319454",
      "commands": "1550225576147820634",
      "Lobby": "1548458810388127794",
      "Survival": "1548459448224456704",
      "gen": "1009221242487832656"
    };

    let currentChannel = null;
    let eventSource = null;

    const channelListEl = document.getElementById('channel-list');
    const pageTitleEl = document.getElementById('page-title');
    const stepCountEl = document.getElementById('step-count');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('message-input');
    const formEl = document.getElementById('send-form');
    const sendBtn = document.getElementById('send-btn');

    // Render sidebar
    Object.keys(CHANNELS).forEach(channelName => {
      const div = document.createElement('div');
      div.className = 'channel';
      const formattedName = channelName.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      div.textContent = formattedName + ' Teardown';
      div.onclick = () => selectChannel(channelName, formattedName);
      channelListEl.appendChild(div);
    });

    function selectChannel(channelName, formattedName) {
      currentChannel = channelName;
      
      document.querySelectorAll('.channel').forEach(el => {
        el.classList.toggle('active', el.textContent === formattedName + ' Teardown');
      });
      
      pageTitleEl.textContent = `${formattedName} Teardown Guide`;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
      
      messagesEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 3rem;">Loading steps...</div>';
      loadMessages();

      if (!eventSource) {
        eventSource = new EventSource(`${API_URL}/api/stream`);
        eventSource.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.channel === currentChannel) {
             appendMessage(msg);
          }
        };
      }
    }

    async function loadMessages() {
      if (!currentChannel) return;
      try {
        const res = await fetch(`${API_URL}/api/messages?channel=${currentChannel}`);
        const data = await res.json();
        
        messagesEl.innerHTML = '';
        stepCountEl.textContent = data.length;
        
        if (data.length === 0) {
            messagesEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 3rem;">No steps recorded yet.</div>';
        } else {
            data.forEach((msg, index) => appendMessage(msg, index + 1));
        }
      } catch (err) {
        messagesEl.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 3rem;">Error loading guide steps.</div>';
      }
    }

    function appendMessage(msg, index) {
      if (document.querySelector(`[data-id="${msg.id}"]`)) return;

      const div = document.createElement('div');
      div.className = 'step-card';
      div.dataset.id = msg.id;
      
      const safeContent = msg.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const timeString = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      // Disguise username as a technician
      const techName = msg.author.charAt(0).toUpperCase() + msg.author.slice(1);

      // Calculate step number (if it's a new message, use the current count)
      const stepNum = index || document.querySelectorAll('.step-card').length + 1;

      div.innerHTML = `
        <div class="step-number">${stepNum}</div>
        <div class="step-content-wrapper">
          <div class="step-header">
            <div class="step-author">
              ${techName} <span class="author-badge">Tech</span>
            </div>
            <div class="step-time">${timeString}</div>
          </div>
          <div class="step-body">${safeContent}</div>
        </div>
      `;
      messagesEl.appendChild(div);
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = inputEl.value.trim();
      if (!content || !currentChannel) return;
      
      inputEl.value = ''; 
      
      try {
        const res = await fetch(`${API_URL}/api/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            content, 
            channel: currentChannel,
            password: "mypassword123" // Make sure this matches index.js!
          })
        });
        
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
        }
      } catch (err) {
        console.error('Failed to send', err);
      }
    });
  </script>
</body>
</html>
